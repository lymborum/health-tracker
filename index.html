<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F4">
<title>健康管理</title>
<link rel="manifest" href="manifest.json">
<style>
@property --p{syntax:"<percentage>";initial-value:0%;inherits:false}
:root{--bg:#F3F6F4;--card:#fff;--ink:#17211C;--sub:#84908A;--line:#E7EDE9;--green:#22B573;--green-bg:#E9F7F0;--amber:#F5A623;--amber-bg:#FDF3E2;--r:18px;--shadow:0 2px 12px rgba(23,33,28,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:0 16px 56px;user-select:none;-webkit-user-select:none}
.view{display:none}.view.on{display:block}
.hero{padding:52px 4px 16px;display:flex;align-items:center;justify-content:space-between}
.hero .day{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--green);margin-bottom:5px}
.hero .day .wt{font-size:14px;font-weight:700;color:var(--green);margin-left:8px;letter-spacing:0;font-variant-numeric:tabular-nums}
.hero .date{font-size:26px;font-weight:700;letter-spacing:-.02em}
.hero .sub{font-size:12px;color:var(--sub);margin-top:3px}
.ringwrap{position:relative;width:74px;height:74px}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--green) var(--p),#E3EAE6 0);transition:--p .6s cubic-bezier(.3,1,.4,1)}
.ring::before{content:"";position:absolute;inset:7px;background:var(--bg);border-radius:50%}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ring .num small{font-size:10px;font-weight:500;color:var(--sub);margin-left:1px}
.sec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--sub);padding:16px 4px 10px;letter-spacing:.06em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* 概况+记录 并排 */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.week{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px}
.week .w-ic{font-size:20px}
.week .w-title{font-size:13px;font-weight:600}
.week .w-sub{font-size:11px;color:var(--sub);line-height:1.5}
.week .w-chg{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.week .w-chg.down{color:var(--green)}
.week .w-chg.up{color:#F06A5E}
.entry{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .15s}
.entry:active{transform:scale(.97)}
.entry .e-ic{font-size:20px}
.entry .e-title{font-size:13px;font-weight:600}
.entry .e-sub{font-size:11px;color:var(--sub);line-height:1.5;white-space:nowrap}
.entry .e-sub.warn{color:#D9822B;font-weight:600}
/* 任务 */
.task{background:var(--card);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.task .row{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.task .ic{font-size:21px;width:30px;text-align:center;flex-shrink:0}
.task .ic svg{width:22px;height:22px;vertical-align:middle;color:#3E4B45}
.task .nm{flex:1;min-width:0}
.task .nm .n{font-size:15px;font-weight:600}
.task .nm .f{font-size:11px;color:var(--sub);margin-top:1px}
.check{width:27px;height:27px;border-radius:50%;border:2px solid #CBD4CE;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:background .2s,border-color .2s;flex-shrink:0}
.task.done{background:linear-gradient(180deg,var(--green-bg),#F0FAF4)}
.task.done .check{background:var(--green);border-color:var(--green);color:#fff}
.task.done.just .check{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.task.half{background:linear-gradient(180deg,#FFFDF6,#FEFBF0)}
.skins{display:flex;gap:6px;flex-shrink:0}
.skin-dot{width:23px;height:23px;border-radius:50%;border:2px solid #CBD4CE;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:transparent;transition:all .2s;cursor:pointer}
.skin-dot.on{background:var(--green);border-color:var(--green);color:#fff;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.task.half .skin-dot:first-child.on{background:var(--amber);border-color:var(--amber)}
.expandbar{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);padding:7px 14px;cursor:pointer;border-top:1px solid var(--line);margin:0 14px;transition:color .2s}
.task.open .expandbar{color:var(--green)}
.task .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.task.open .detail{grid-template-rows:1fr}
.task .detail>div{overflow:hidden}
.task .detail .in{padding:2px 16px 13px;font-size:13px;line-height:1.7;color:#3D4A44;border-top:1px solid var(--line);margin:0 14px;padding-top:9px}
.task.rest{opacity:.55}
.task.rest .check{border-style:dashed}
.task.rest .rest-tag{font-size:11px;color:var(--sub);font-weight:500;flex-shrink:0}
/* 数据页 */
.topbar{display:flex;align-items:center;gap:12px;padding:52px 4px 14px}
.topbar .back{font-size:22px;padding:6px;cursor:pointer}
.topbar .t{font-size:18px;font-weight:700}
.metric{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.metric .mh{display:flex;align-items:baseline;justify-content:space-between}
.metric .mh .n{font-size:15px;font-weight:600}
.metric .mh .unit{font-size:11px;color:var(--sub);margin-left:2px}
.metric .mh .last{font-size:12px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.metric .ctrl{display:flex;align-items:center;gap:8px;margin-top:10px}
.metric input{flex:1;max-width:130px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center;background:#FAFCFB;outline:none}
.metric input:focus{border-color:var(--green)}
.metric .save{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .15s}
.metric .save:active{transform:scale(.94)}
.metric svg{width:100%;height:46px;margin-top:10px;display:block;overflow:visible}
.metric .hist{font-size:12px;color:#3D4A44;font-weight:500;margin-top:8px;line-height:1.6}
.metric .undo{font-size:10px;color:var(--sub);margin-left:8px;cursor:pointer;opacity:.8}
.metric .tip{font-size:11px;color:var(--sub);margin-top:6px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(10px);background:rgba(23,33,28,.88);color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="view on" id="mainView">
  <div class="hero">
    <div>
      <div class="day">健康管理<span class="wt" id="heroWt"></span></div>
      <div class="date" id="dateLabel"></div>
      <div class="sub" id="dateSub"></div>
    </div>
    <div class="ringwrap"><div class="ring"><div class="num" id="ringNum"></div></div></div>
  </div>
  <div class="sec">今日</div>
  <div class="row2">
    <div class="week" id="weekCard"></div>
    <div class="entry" onclick="goData()">
      <div class="e-ic">📊</div>
      <div class="e-title">数据记录</div>
      <div class="e-sub" id="entrySub"></div>
    </div>
  </div>
  <div class="sec">今日任务</div>
  <div id="taskList"></div>
</div>

<div class="view" id="dataView">
  <div class="topbar"><div class="back" onclick="goMain()">‹</div><div class="t">数据记录</div></div>
  <div id="metricList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const START="2026-08-29";
const WEEK_START="2026-08-31";
const TASKS=[
 {id:"breakfast",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a3 3 0 0 1 0 6h-1"/><path d="M4 8h13v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8z"/><path d="M7 4v3M10.5 4v3M14 4v3"/></svg>',n:"早餐",f:"每天",d:"8:00 前吃。食堂：1 蛋+无糖豆浆+玉米/包子；宿舍：燕麦/黑芝麻糊冲泡+1 盒纯牛奶。牛奶选纯牛奶（配料只有生牛乳）。"},
 {id:"walk",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg>',n:"快走 30 分钟",f:"每天",d:"17:30-18:00 开始，操场绕圈约 3km，微喘能说话。先喝半杯水、穿运动鞋。下雨改走廊/楼梯间或宿舍原地踏步。"},
 {id:"strength",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M8 12h8"/></svg>',n:"自重训练",f:"隔天",d:"热身：高抬腿 40 秒+开合跳 40 秒+原地踏步。深蹲 3×15→反向弓步 2×10/腿→保加利亚分腿蹲 2×8/腿（后脚搭台阶）→台阶上步 2×10/腿→站姿收腹呼吸 10 次→体前屈摸台阶 10 次。组间休息 45-60 秒，做不完减量。",kind:"strength"},
 {id:"skin",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M12 9a4.5 4.5 0 0 0-3 4"/></svg>',n:"护肤",f:"早 · 晚",d:"早：温水洁面（30 秒）→CeraVe 保湿乳（黄豆大小）→薇诺娜防晒乳（一元硬币量，等 2 分钟成膜），阴天也涂。晚：洁面→CeraVe 保湿乳。周六加：水杨酸棉片擦 T 区/痘痘处（避开眼周），等干后涂保湿。",kind:"skin"},
 {id:"bedtime",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/><path d="M17 4l.5 1.5L19 6l-1.5.5L17 8l-.5-1.5L15 6l1.5-.5z"/></svg>',n:"睡前仪式",f:"每天",d:"睡前床上体态：仰卧收腹呼吸 2 分钟+下巴后缩 10×2+仰卧开臂深呼吸 1 分钟。23:30 关掉视频/浏览，手机充电放书桌不带上床。第一周 12:30，第二周起 12:00。"}
];
const METRICS=[
 {id:"weight",n:"体重",unit:"kg",tip:"每周日早上，空腹、同样衣服称一次。"},
 {id:"waist",n:"腰围",unit:"cm",tip:"每 4 周，肚脐上方两指宽水平一圈。"},
 {id:"hip",n:"臀围",unit:"cm",tip:"每 4 周，臀部最丰满处水平一圈。"},
 {id:"thigh",n:"大腿围",unit:"cm",tip:"每 4 周，臀沟下方最粗处水平一圈。"}
];
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysFromStart(){const s=new Date(START),n=new Date();return Math.floor((n-s)/864e5)}
function weekNum(){const d=Math.floor((new Date()-new Date(WEEK_START))/864e5);return d<0?0:Math.floor(d/7)+1}
function isTrainDay(){const d=Math.floor((new Date()-new Date(WEEK_START))/864e5);return d%2===0}
function load(){try{return JSON.parse(localStorage.getItem("tasks_v5"))||{logs:{},metrics:{}}}catch(e){return{logs:{},metrics:{}}}}
let data=load();
function save(){localStorage.setItem("tasks_v5",JSON.stringify(data))}
function dayLog(){const k=today();if(!data.logs[k])data.logs[k]={};return data.logs[k]}
function skinState(log){const s=log.skin||0;return{am:s>=1,pm:s>=2,total:s}}
function gotToday(log){let c=0;if(log.breakfast)c++;if(log.walk)c++;if(isTrainDay()&&log.strength)c++;c+=(log.skin||0);if(log.bedtime)c++;return c}
function totalToday(){return isTrainDay()?6:5}
function render(){
 const d=new Date();const wd=["日","一","二","三","四","五","六"][d.getDay()];
 document.getElementById("dateLabel").textContent=d.getMonth()+1+"月"+d.getDate()+"日";
 document.getElementById("dateSub").textContent="星期"+wd+" · 第 "+weekNum()+" 周";
 const train=isTrainDay();
 document.getElementById("taskList").innerHTML=TASKS.map((t,i)=>{
  let cls="",tail="",rowClick="";
  if(t.kind==="strength"){
   if(!train){cls=" rest";tail=`<span class="rest-tag">今日休息</span><div class="check">—</div>`}
   else{const on=!!dayLog().strength;cls=on?" done":"";tail=`<div class="check">✓</div>`;rowClick=`onclick="toggle('${t.id}')"`}
  }else if(t.kind==="skin"){
   const s=skinState(dayLog());cls=s.total>=2?" done":(s.total>=1?" half":"");
   tail=`<div class="skins"><div class="skin-dot ${s.am?"on":""}" onclick="tapSkin(0,event)">${s.am?"✓":"早"}</div><div class="skin-dot ${s.pm?"on":""}" onclick="tapSkin(1,event)">${s.pm?"✓":"晚"}</div></div>`;
   rowClick=`onclick="cycleSkin()"`;
  }else{
   const on=!!dayLog()[t.id];cls=on?" done":"";tail=`<div class="check">✓</div>`;rowClick=`onclick="toggle('${t.id}')"`;
  }
  return `<div class="task${cls}" id="t_${t.id}" style="animation:fadeUp .35s ease ${i*50}ms both">
   <div class="row" ${rowClick}><div class="ic">${t.ic}</div><div class="nm"><div class="n">${t.n}</div><div class="f">${t.f}${t.kind==="strength"&&train?" · 今天该练":""}</div></div><div class="tail">${tail}</div></div>
   <div class="expandbar" onclick="openDetail('${t.id}',event)">▾ 展开</div>
   <div class="detail"><div><div class="in">${t.d}</div></div></div></div>`;
 }).join("");
 updateSummary();
}
function seedBaseline(){
 if(Object.keys(data.metrics).length>0)return;
 const b={weight:80,waist:92,hip:104,thigh:62};
 METRICS.forEach(m=>data.metrics[m.id]=[{d:START,v:b[m.id]}]);
 save();
}
function updateSummary(){
 const log=dayLog();const got=gotToday(log),tot=totalToday();
 const ring=document.querySelector(".ring");ring.style.setProperty("--p",(got/tot*100)+"%");
 document.getElementById("ringNum").innerHTML=got+"<small>/"+tot+"</small>";
 document.getElementById("heroWt").textContent=(lastMetric("weight")||0)+"kg";
 document.getElementById("weekCard").innerHTML=weekCard();
 document.getElementById("entrySub").innerHTML=entrySub();
}
function weekCard(){
 const logs=data.logs;const keys=Object.keys(logs).sort();
 let days=0;const wk=new Date();wk.setHours(0,0,0,0);wk.setDate(wk.getDate()-wk.getDay()+1);
 keys.forEach(k=>{const t=new Date(k);t.setHours(0,0,0,0);if(t>=wk&&gotToday(logs[k])>0)days++});
 const sub="本周打卡 "+days+"/7 天";
 const wv=lastMetric("weight"),pv=prevMetric("weight");
 let chg="";
 if(wv&&pv!==null){const diff=wv-pv;chg=`<div class="w-sub w-chg ${diff>0?"up":"down"}">体重 ${diff<=0?"−":"+"}${Math.abs(diff).toFixed(1)}kg</div>`;}
 return `<div class="w-ic">📅</div><div class="w-title">本周概况</div><div class="w-sub">${sub}</div>${chg}`;
}
function entrySub(){
 const d=new Date(),dow=d.getDay();
 if(dow===0)return `<span class="warn">今天该记录体重</span>`;
 if(dow===6&&!lastMetric("weight"))return `<span class="warn">明天该记录体重</span>`;
 const cyc=daysFromStart()%28;
 if(cyc===27)return `<span class="warn">今天该记录围度</span>`;
 if(cyc===26)return `<span class="warn">明天该记录围度</span>`;
 return "体重·腰围·臀围·腿围";
}
function lastMetric(id){const a=data.metrics[id];return a&&a.length?a[a.length-1].v:null}
function prevMetric(id){const a=data.metrics[id];return a&&a.length>1?a[a.length-2].v:null}
function toggle(id){const l=dayLog();l[id]=!l[id];save();updateTaskCard(id);updateSummary()}
function cycleSkin(){const l=dayLog();l.skin=((l.skin||0)+1)%3;save();updateTaskCard("skin");updateSummary()}
function tapSkin(which,e){e.stopPropagation();const l=dayLog();const s=skinState(l);
 l.skin=(which===0?(s.am?0:1):(s.am?1:0))+(which===1?(s.pm?0:1):(s.pm?1:0));
 save();updateTaskCard("skin");updateSummary()}
function updateTaskCard(id){
 const el=document.getElementById("t_"+id);if(!el)return;const t=TASKS.find(x=>x.id===id);const l=dayLog();
 if(t.kind==="skin"){const s=skinState(l);el.className="task"+(s.total>=2?" done":(s.total>=1?" half":""));
  const dots=el.querySelectorAll(".skin-dot");dots[0].className="skin-dot"+(s.am?" on":"");dots[1].className="skin-dot"+(s.pm?" on":"");dots[0].textContent=s.am?"✓":"早";dots[1].textContent=s.pm?"✓":"晚";}
 else{const on=!!l[id];el.className="task"+(on?" done":"");
  if(on){el.classList.add("just");setTimeout(()=>el.classList.remove("just"),500)}}
}
function openDetail(id,e){e.stopPropagation();const el=document.getElementById("t_"+id);el.classList.toggle("open");
 const ar=el.querySelector(".expandbar");ar.innerHTML=el.classList.contains("open")?"▴ 收起":"▾ 展开"}
function goData(){document.getElementById("mainView").classList.remove("on");document.getElementById("dataView").classList.add("on");renderData()}
function goMain(){document.getElementById("dataView").classList.remove("on");document.getElementById("mainView").classList.add("on")}
function renderData(){
 document.getElementById("metricList").innerHTML=METRICS.map((m,i)=>{
  const vals=data.metrics[m.id]||[];const last=vals.length?vals[vals.length-1]:"";
  const lastTxt=last?last.v+m.unit+" · "+last.d.slice(5):"暂无";
  const hist=vals.length?vals.slice(-3).map(p=>p.d.slice(5)+" "+p.v+m.unit).join("　"):"还没有记录";
  const undo=vals.length?`<span class="undo" onclick="undoMetric('${m.id}')">撤销最近一条</span>`:"";
  const chart=vals.length>=2?svgChart(vals.slice(-10)):"";
  return `<div class="metric" style="animation:fadeUp .3s ease ${i*50}ms both"><div class="mh"><span><span class="n">${m.n}</span><span class="unit">${m.unit}</span></span><span class="last">${lastTxt}</span></div>
   <div class="ctrl"><input id="in_${m.id}" type="number" inputmode="decimal" placeholder="输入 ${m.unit}"><button class="save" onclick="addMetric('${m.id}')">记录</button></div>
   <svg>${chart}</svg>
   <div class="hist">${hist}${undo}</div>
   <div class="tip">${m.tip}</div></div>`;
 }).join("");
}
function addMetric(id){const v=parseFloat(document.getElementById("in_"+id).value);
 if(!v||v<=0){toast("请输入有效数字");return}
 if(!data.metrics[id])data.metrics[id]=[];
 data.metrics[id].push({d:today(),v:v});save();renderData();updateSummary();toast("已记录 "+v)
}
function undoMetric(id){if(!data.metrics[id]||!data.metrics[id].length)return;data.metrics[id].pop();save();renderData();updateSummary();toast("已撤销最近一条")}
function svgChart(pts){const w=300,h=40;const vs=pts.map(p=>p.v);
 const min=Math.min(...vs),max=Math.max(...vs),range=(max-min)||1;
 const x=i=>12+i*(w-24)/(pts.length-1),y=v=>h-7-(v-min)/range*(h-16);
 const last=pts[pts.length-1],prev=pts[pts.length-2];
 const color=last.v<prev.v?"#22B573":(last.v>prev.v?"#F06A5E":"#84908A");
 return `<polyline points="${pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:400;stroke-dashoffset:400;animation:draw .7s ease forwards"/>`;
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1500)}
seedBaseline();
render();
</script>
